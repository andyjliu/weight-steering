# Weight-steering data-scaling recipe. This differs from the canonical
# multimodel recipe only where validation and warmup distort very small n.
base_model: __BASE_MODEL__
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_8bit: true
load_in_4bit: false
strict: false

datasets:
  - path: __DATASET__
    type: chat_template
    field_messages: messages
    roles_to_train: ["assistant"]
chat_template: tokenizer_default
train_on_inputs: false

dataset_prepared_path: __OUTPUT_DIR__/prepared
output_dir: __OUTPUT_DIR__
val_set_size: 0

adapter: lora
lora_r: 32
lora_alpha: 16
lora_dropout: 0.0
lora_target_linear: true
lora_modules_to_save:
  - embed_tokens
  - lm_head

sequence_len: 4096
sample_packing: false
eval_sample_packing: false
pad_to_sequence_len: false

micro_batch_size: 4
gradient_accumulation_steps: 2
num_epochs: 1
optimizer: adamw_bnb_8bit
lr_scheduler: linear
learning_rate: 5.0e-5
warmup_steps: 0
weight_decay: 0.01

bf16: auto
tf32: false
gradient_checkpointing: true
flash_attention: false
logging_steps: 1

save_steps: 20
save_total_limit: 1
load_best_model_at_end: false
seed: 42
special_tokens: {}
